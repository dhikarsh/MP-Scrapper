<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Pasar — Produk Terlaris Mingguan</title>
    <meta name="description" content="Dashboard produk terlaris per kategori Shopee.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* ====== RESET & VARIABLES ====== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg: #F0F2F5;
            --surface: #FFFFFF;
            --surface-soft: #F8FAFD;
            --border: #E2E8F0;
            --text: #1A202C;
            --muted: #718096;
            --primary: #4F46E5;
            --primary-light: #EEF2FF;
            --shopee: #EE4D2D;
            --shopee-light: #FFF0ED;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 8px 32px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --transition: 0.25s ease;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            padding: 0;
            margin: 0;
        }
        .wrap {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ====== TICKER ====== */
        .ticker-wrap {
            background: var(--primary-light);
            border-bottom: 1px solid var(--border);
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            padding: 8px 0;
        }
        .ticker-track {
            display: inline-flex;
            animation: scroll-left 50s linear infinite;
        }
        .ticker-wrap:hover .ticker-track {
            animation-play-state: paused;
        }
        @keyframes scroll-left {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }
        .ticker-item {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 0 28px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--muted);
            border-right: 1px solid rgba(79, 70, 229, 0.15);
        }
        .ticker-item b {
            color: var(--text);
            font-weight: 700;
        }
        .ticker-item .up {
            color: var(--shopee);
            font-weight: 700;
        }

        /* ====== HEADER ====== */
        header.hero {
            padding: 40px 0 24px;
        }
        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: var(--primary);
            background: var(--primary-light);
            padding: 6px 14px;
            border-radius: 999px;
            border: 1px solid rgba(79, 70, 229, 0.2);
        }
        .eyebrow .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }
        h1.title {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: -0.02em;
            margin: 18px 0 6px;
            line-height: 1.1;
        }
        h1.title .accent {
            color: var(--primary);
        }
        p.sub {
            color: var(--muted);
            font-size: 16px;
            max-width: 600px;
            line-height: 1.6;
        }
        .meta-row {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            margin-top: 18px;
        }
        .meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: var(--muted);
        }
        .meta strong {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            margin-top: 2px;
        }

        /* ====== PLATFORM TABS ====== */
        .platform-tabs {
            display: flex;
            gap: 12px;
            margin: 24px 0 20px;
        }
        .ptab {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1.5px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .ptab:hover {
            border-color: var(--primary);
            transform: translateY(-1px);
        }
        .ptab.active {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .ptab .p-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            flex-shrink: 0;
        }
        .ptab.shopee .p-icon {
            background: var(--shopee);
        }
        .ptab.tokopedia .p-icon {
            background: #22B07D;
        }
        .ptab .p-name {
            font-weight: 700;
            font-size: 16px;
        }
        .ptab .p-count {
            font-size: 13px;
            color: var(--muted);
            margin-top: 1px;
        }

        /* ====== STATS ====== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin: 24px 0 28px;
        }
        @media (max-width: 900px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 20px 16px;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-hover);
        }
        .stat-card .label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
        }
        .stat-card .value {
            font-size: 28px;
            font-weight: 800;
            margin-top: 6px;
            color: var(--text);
        }
        .stat-card .foot {
            font-size: 13px;
            color: var(--muted);
            margin-top: 4px;
        }

        /* ====== CONTROLS & FILTER ====== */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            margin: 8px 0 24px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
        }
        .search {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            background: var(--surface);
            color: var(--text);
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .search:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .search::placeholder {
            color: var(--muted);
        }

        .sortsel {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow);
        }
        .sortsel:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* ====== CATEGORY FILTER CHIPS ====== */
        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: nowrap;
            overflow-x: auto;
            padding: 4px 0 8px;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .chips::-webkit-scrollbar {
            height: 4px;
        }
        .chips::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        .chip {
            flex-shrink: 0;
            font-weight: 600;
            font-size: 13px;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--muted);
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
            white-space: nowrap;
            box-shadow: var(--shadow);
        }
        .chip:hover {
            border-color: var(--primary);
            color: var(--text);
            transform: translateY(-1px);
        }
        .chip.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        /* ====== CATEGORY SECTION ====== */
        .cat-section {
            margin-bottom: 48px;
            scroll-margin-top: 80px;
        }
        .cat-head {
            display: flex;
            align-items: baseline;
            gap: 14px;
            margin-bottom: 16px;
        }
        .cat-head .idx {
            font-family: 'JetBrains Mono', monospace;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
        }
        .cat-head h2 {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.01em;
        }
        .cat-head .count {
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            color: var(--muted);
            background: var(--surface-soft);
            padding: 4px 12px;
            border-radius: 999px;
            border: 1px solid var(--border);
        }

        /* ====== PRODUCT CARDS ====== */
        .cat-body {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 24px;
            align-items: start;
        }
        @media (max-width: 1024px) {
            .cat-body {
                grid-template-columns: 1fr;
            }
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            position: relative;
            transition: var(--transition);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: var(--primary);
        }
        .card .rank {
            position: absolute;
            top: 12px;
            right: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--muted);
            background: var(--surface-soft);
            padding: 2px 10px;
            border-radius: 999px;
            border: 1px solid var(--border);
        }
        .rank-1 {
            color: var(--shopee) !important;
            background: var(--shopee-light) !important;
            border-color: var(--shopee) !important;
        }
        .card .product-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            background: var(--surface-soft);
            margin-bottom: 12px;
        }
        .card .nama {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            margin: 0 0 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card .toko {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 10px;
        }
        .card .price-row {
            margin: 6px 0 10px;
        }
        .card .price-row .harga {
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 800;
            color: var(--text);
        }
        .card .kpi-row {
            display: flex;
            gap: 16px;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
            margin-top: auto;
        }
        .card .kpi {
            flex: 1;
        }
        .card .kpi .k-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--muted);
        }
        .card .kpi .k-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 700;
            margin-top: 2px;
        }
        .card .kpi .k-value.star {
            color: #F59E0B;
        }
        .card .link-produk {
            margin-top: 10px;
            font-size: 12px;
        }
        .card .link-produk a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
        }
        .card .link-produk a:hover {
            text-decoration: underline;
        }

        /* ====== BUCKET PANEL (Sidebar) ====== */
        .bucket-panel {
            background: var(--surface-soft);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            position: sticky;
            top: 20px;
            box-shadow: var(--shadow);
        }
        .bucket-panel h4 {
            font-size: 16px;
            font-weight: 700;
            margin: 0 0 4px;
        }
        .bucket-panel .hint {
            font-size: 13px;
            color: var(--muted);
            margin: 0 0 14px;
            line-height: 1.5;
        }
        .bucket-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .bucket-row .b-range {
            width: 80px;
            flex-shrink: 0;
            font-family: 'JetBrains Mono', monospace;
            color: var(--muted);
        }
        .bucket-row .b-bar-wrap {
            flex: 1;
            height: 8px;
            border-radius: 999px;
            background: var(--border);
            overflow: hidden;
        }
        .bucket-row .b-bar {
            height: 100%;
            background: var(--primary);
            border-radius: 999px;
            transition: width 0.6s ease;
        }
        .bucket-row .b-val {
            width: 60px;
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            flex-shrink: 0;
        }
        .bucket-best {
            margin-top: 16px;
            padding: 12px 14px;
            background: #ECFDF5;
            border-radius: 10px;
            font-size: 13px;
            color: #065F46;
            line-height: 1.5;
        }
        .bucket-best b {
            font-weight: 700;
        }

        /* ====== FOOTER ====== */
        footer {
            border-top: 1px solid var(--border);
            padding: 32px 0 40px;
            margin-top: 20px;
        }
        footer p {
            color: var(--muted);
            font-size: 13.5px;
            line-height: 1.7;
            max-width: 700px;
        }
        footer .badge-warn {
            display: inline-block;
            background: #FEF3C7;
            border: 1px solid #FCD34D;
            color: #92400E;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 999px;
            margin-bottom: 10px;
        }

        /* ====== UTILITY ====== */
        .empty {
            color: var(--muted);
            font-size: 15px;
            padding: 40px 0;
            text-align: center;
        }
        .loading {
            text-align: center;
            padding: 60px 0;
            color: var(--muted);
            font-size: 16px;
        }
        .loading .spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 12px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"></div></div>

<div class="wrap">
    <header class="hero">
        <span class="eyebrow"><span class="dot"></span> Update Mingguan · Riset Onboarding Akulaku</span>
        <h1 class="title">Radar Pasar <span class="accent">/</span> Produk Terlaris</h1>
        <p class="sub">Produk terlaris per kategori Shopee — update mingguan.</p>
        <div class="meta-row">
            <div class="meta">PERIODE<strong id="metaPeriode">—</strong></div>
            <div class="meta">TERAKHIR DIPERBARUI<strong id="metaUpdated">—</strong></div>
        </div>
    </header>

    <div class="platform-tabs" id="platformTabs"></div>

    <section class="stats-grid" id="statsGrid"></section>

    <div class="controls">
        <input class="search" id="searchInput" type="text" placeholder="Cari produk atau toko…">
        <select class="sortsel" id="sortSelect">
            <option value="rank">Urutkan: Ranking</option>
            <option value="terjual">Urutkan: Jumlah Terjual</option>
            <option value="harga-asc">Urutkan: Harga Terendah</option>
            <option value="harga-desc">Urutkan: Harga Tertinggi</option>
            <option value="rating">Urutkan: Rating</option>
        </select>
        <div class="chips" id="categoryChips"></div>
    </div>

    <main id="categoryContainer"><div class="loading"><span class="spinner"></span> Memuat data...</div></main>

    <footer>
        <span class="badge-warn">📊 DATA STATIS (UPDATE MINGGUAN)</span>
        <p>Data diambil dari file JSON statis. Untuk memperbarui, jalankan scraping ulang.</p>
    </footer>
</div>

<script>
// ============================================================
// FUNGSI MEMBACA FILE JSON STATIS
// ============================================================
async function fetchData() {
    const container = document.getElementById("categoryContainer");
    container.innerHTML = `<div class="loading"><span class="spinner"></span> Memuat data...</div>`;

    try {
        const response = await fetch("data/products.json");
        if (!response.ok) {
            throw new Error(`Gagal load data: ${response.status}`);
        }
        const data = await response.json();
        window.DATA = data;
        activePlatform = data.platforms[0].id;
        buildTicker();
        buildPlatformTabs();
        buildChips();
        buildStats();
        render();
    } catch (error) {
        container.innerHTML = `
            <div class="empty">
                ❌ Gagal memuat data.<br>
                Pastikan file <code>data/products.json</code> tersedia.<br>
                <small>Error: ${error.message}</small>
            </div>
        `;
        console.error("Error:", error);
    }
}

// ============================================================
// FUNGSI TEMPLATE
// ============================================================
const CAT_COLORS = ["#4F46E5","#EE4D2D","#22B07D","#F59E0B","#8B5CF6","#EC4899","#06B6D4","#F97316","#14B8A6","#6366F1"];
const BUCKET_EDGES = [0, 20000, 50000, 100000, 200000, 500000, 1000000, Infinity];
const BUCKET_LABELS = ["<20rb","20-50rb","50-100rb","100-200rb","200-500rb","500rb-1jt",">1jt"];

let activePlatform = null;
let activeCategory = "all";

function rupiah(n){ return "Rp" + Number(n).toLocaleString("id-ID"); }
function angka(n){ return Number(n).toLocaleString("id-ID"); }

function currentPlatform(){ return window.DATA.platforms.find(p=>p.id===activePlatform); }
function allProductsInPlatform(){
    const out = [];
    currentPlatform().kategori.forEach(cat=>{
        cat.produk.forEach(p=> out.push({...p, kategoriId:cat.id, kategoriNama:cat.nama}));
    });
    return out;
}

function buildTicker(){
    const all = [];
    window.DATA.platforms.forEach(pf=> pf.kategori.forEach(cat=> cat.produk.forEach(p=> all.push({...p, platform: pf.nama}))));
    const top = all.sort((a,b)=>b.terjual_minggu_ini - a.terjual_minggu_ini).slice(0,12);
    const items = top.map(p=>`<span class="ticker-item"><span class="up">▲</span> <b>${p.nama}</b> — ${p.platform} · ${rupiah(p.harga)} · ${angka(p.terjual_minggu_ini)} terjual</span>`).join("");
    document.getElementById("tickerTrack").innerHTML = items + items;
}

function buildPlatformTabs(){
    const wrap=document.getElementById("platformTabs"); wrap.innerHTML="";
    window.DATA.platforms.forEach(pf=>{
        const el=document.createElement("div"); el.className="ptab "+pf.id+(pf.id===activePlatform?" active":"");
        const total=pf.kategori.reduce((s,c)=>s+c.produk.length,0);
        el.innerHTML=`
            <div class="p-icon">${pf.nama[0]}</div>
            <div>
                <div class="p-name">${pf.nama}</div>
                <div class="p-count">${pf.kategori.length} kategori · ${total} produk</div>
            </div>
        `;
        el.onclick=()=>{ activePlatform=pf.id; activeCategory="all"; buildPlatformTabs(); buildChips(); buildStats(); render(); };
        wrap.appendChild(el);
    });
}

function buildChips(){
    const wrap=document.getElementById("categoryChips"); wrap.innerHTML="";
    const allChip=document.createElement("div"); allChip.className="chip active"; allChip.textContent="SEMUA KATEGORI";
    allChip.onclick=()=>{activeCategory="all"; refreshChips(); render();}; wrap.appendChild(allChip);
    currentPlatform().kategori.forEach(c=>{
        const chip=document.createElement("div"); chip.className="chip"; chip.dataset.cat=c.id; chip.textContent=c.nama;
        chip.onclick=()=>{activeCategory=c.id; refreshChips(); render();}; wrap.appendChild(chip);
    });
}

function refreshChips(){
    document.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
    if(activeCategory==="all"){ document.querySelector(".chip").classList.add("active"); }
    else { document.querySelector(`.chip[data-cat="${activeCategory}"]`).classList.add("active"); }
}

function buildStats(){
    const prods=allProductsInPlatform(); const total=prods.reduce((s,p)=>s+p.terjual_minggu_ini,0);
    const catTotals=currentPlatform().kategori.map(c=>({nama:c.nama, total:c.produk.reduce((s,p)=>s+p.terjual_minggu_ini,0)})).sort((a,b)=>b.total-a.total);
    const top=catTotals[0]||{nama:"-",total:0}; const avg=prods.length?Math.round(prods.reduce((s,p)=>s+p.harga,0)/prods.length):0;
    const stats=[
        {label:"Total Produk", value:prods.length, foot:currentPlatform().kategori.length+" kategori"},
        {label:"Total Transaksi", value:angka(total)+" unit", foot:"total sepanjang masa"},
        {label:"Rata-rata Harga", value:rupiah(avg), foot:"seluruh produk"},
        {label:"Kategori Paling Laris", value:top.nama, foot:angka(top.total)+" unit"}
    ];
    document.getElementById("statsGrid").innerHTML = stats.map(s=>`
        <div class="stat-card">
            <div class="label">${s.label}</div>
            <div class="value">${s.value}</div>
            <div class="foot">${s.foot}</div>
        </div>
    `).join("");
}

function bucketize(produk){
    const buckets=BUCKET_LABELS.map(()=>({jumlahProduk:0,totalTerjual:0}));
    produk.forEach(p=>{
        for(let i=0;i<BUCKET_EDGES.length-1;i++){
            if(p.harga>=BUCKET_EDGES[i] && p.harga<BUCKET_EDGES[i+1]){
                buckets[i].jumlahProduk++;
                buckets[i].totalTerjual+=p.terjual_minggu_ini;
                break;
            }
        }
    });
    return buckets;
}

function bucketPanelHTML(produk){
    const buckets=bucketize(produk);
    const maxVal=Math.max(1,...buckets.map(b=>b.totalTerjual));
    let best={i:0,val:-1};
    buckets.forEach((b,i)=>{ if(b.totalTerjual>best.val){ best={i,val:b.totalTerjual}; } });
    const rows=buckets.map((b,i)=> b.jumlahProduk===0?"":`
        <div class="bucket-row">
            <span class="b-range">${BUCKET_LABELS[i]}</span>
            <span class="b-bar-wrap"><span class="b-bar" style="width:${(b.totalTerjual/maxVal*100).toFixed(0)}%; ${i===best.i?'background:#22B07D':''}"></span></span>
            <span class="b-val">${angka(b.totalTerjual)}</span>
        </div>
    `).join("");
    const bestLabel=BUCKET_LABELS[best.i];
    return `
        <div class="bucket-panel">
            <h4>Analisis Rentang Harga</h4>
            <p class="hint">Total unit terjual per rentang harga.</p>
            ${rows || '<p class="hint" style="margin-top:10px;">Belum ada data.</p>'}
            ${best.val>0 ? `<div class="bucket-best"><b>💡 Sweet spot:</b> rentang harga <b>${bestLabel}</b> paling banyak terjual.</div>` : ''}
        </div>
    `;
}

function cardHTML(p, idx){
    const rankClass = (idx+1) === 1 ? 'rank-1' : '';
    return `
        <div class="card">
            <span class="rank ${rankClass}">#${idx+1}</span>
            ${p.image ? `<img class="product-img" src="${p.image}" alt="${p.nama}" loading="lazy">` : ''}
            <div class="nama">${p.nama}</div>
            <div class="toko">${p.toko}</div>
            <div class="price-row"><span class="harga">${rupiah(p.harga)}</span></div>
            <div class="kpi-row">
                <div class="kpi">
                    <div class="k-label">Terjual</div>
                    <div class="k-value">${angka(p.terjual_minggu_ini)}</div>
                </div>
                <div class="kpi">
                    <div class="k-label">Rating</div>
                    <div class="k-value star">★ ${p.rating}</div>
                </div>
            </div>
            <div class="link-produk"><a href="${p.url}" target="_blank">🔗 Lihat Produk</a></div>
        </div>
    `;
}

function render(){
    const q=document.getElementById("searchInput").value.trim().toLowerCase();
    const sortBy=document.getElementById("sortSelect").value;
    const container=document.getElementById("categoryContainer");
    container.innerHTML="";

    const cats=currentPlatform().kategori.filter(c=> activeCategory==="all"||c.id===activeCategory);
    let any=false;

    cats.forEach((cat, idx)=>{
        let produk=cat.produk.filter(p=>p.nama.toLowerCase().includes(q)||p.toko.toLowerCase().includes(q));
        if(produk.length===0) return;
        any=true;

        produk=[...produk].sort((a,b)=>{
            if(sortBy==="terjual") return b.terjual_minggu_ini - a.terjual_minggu_ini;
            if(sortBy==="harga-asc") return a.harga - b.harga;
            if(sortBy==="harga-desc") return b.harga - a.harga;
            if(sortBy==="rating") return b.rating - a.rating;
            return 0;
        });

        const section=document.createElement("section");
        section.className="cat-section";
        section.id="cat-"+cat.id;
        section.innerHTML=`
            <div class="cat-head">
                <span class="idx">${String(idx+1).padStart(2,"0")}</span>
                <h2>${cat.nama}</h2>
                <span class="count">${produk.length} produk</span>
            </div>
            <div class="cat-body">
                <div class="cards">${produk.map((p,i)=>cardHTML(p,i)).join("")}</div>
                ${bucketPanelHTML(cat.produk)}
            </div>
        `;
        container.appendChild(section);
    });

    if(!any){
        container.innerHTML=`<div class="empty">Tidak ada produk yang cocok dengan pencarian "${q}".</div>`;
    }

    document.getElementById("metaPeriode").textContent = window.DATA.minggu;
    document.getElementById("metaUpdated").textContent = new Date(window.DATA.terakhir_diperbarui).toLocaleString("id-ID",{dateStyle:"long",timeStyle:"short"});
}

fetchData();
</script>
